[pytest]
# Автоматическое определение асинхронных тестов плагином pytest-asyncio
asyncio_mode = auto

# Явная фиксация области видимости цикла событий для асинхронных фикстур
asyncio_default_fixture_loop_scope = function

# Регистрация корневой директории в sys.path для корректных импортов пакета app
pythonpath = .

# Корневой каталог для обнаружения тестовых сценариев
testpaths = tests

# Шаблон сопоставления файлов с тестами
python_files = test_*.py

# Флаги запуска: подробный отчет (-v) и сквозной вывод stdout/логов (-s)
addopts = -v -s

# Фильтрация предупреждений об устаревших вызовах внутри pytest_asyncio
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*: