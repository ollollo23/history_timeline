name: CI Pipeline

# Настройка триггеров автоматического запуска при пуше в ветки и открытии Pull Request
on: [push, pull_request]

jobs:
  tests:
    name: Run Linting and Tests
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонирование репозитория в рабочую директорию виртуальной машины
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2: Установка целевой версии интерпретатора Python 3.14
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Шаг 3: Обновление пакетного менеджера pip и установка зависимостей проекта
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Шаг 4: Запуск статического анализатора кода для проверки стандартов форматирования и чистоты
      - name: Run linter
        run: ruff check .

      # Шаг 5: Исполнение набора асинхронных интеграционных и модульных тестов
      - name: Run tests
        run: pytest